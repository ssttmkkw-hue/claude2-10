function genDeck() {
  const pick = new Set();
  const r = a => a[Math.floor(Math.random() * a.length)];
  pick.add(r(WINCON)); pick.add(r(BIGSPELL)); pick.add(r(ANTIAIR));
  if (Math.random() < 0.6) pick.add(r(['cannonB', 'tomb', 'inferno']));

  const rest = shuffle(ALL_CARDS.filter(c => !WINCON.includes(c) || Math.random() < 0.25));
  for (const c of rest) { if (pick.size >= 8) break; pick.add(c); }

}

// =====================================================================

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const TAU = Math.PI * 2;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let seed = 1;
const srnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// --- 绘图小工具（使用当前 lineWidth / strokeStyle） ---
function rrp(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function RR(g, x, y, w, h, r, f) { rrp(g, x, y, w, h, r); g.fillStyle = f; g.fill(); g.stroke(); }
function C(g, x, y, r, f) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = f; g.fill(); g.stroke(); }
function E(g, x, y, rx, ry, f, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fillStyle = f; g.fill(); g.stroke(); }
function P(g, pts, f) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fillStyle = f; g.fill(); g.stroke(); }
function HL(g, x, y, rx, ry, a = 0.45) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fillStyle = `rgba(255,255,255,${a})`; g.fill(); }
function dot(g, x, y, r, f) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = f; g.fill(); }
function line(g, x1, y1, x2, y2, w, col) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineWidth = w; g.strokeStyle = col; g.stroke(); }

function txt(g, s, x, y, size, fill = '#fff', align = 'center', stroke = OUT, lw) {
  g.font = `900 ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = lw ?? Math.max(2, size * 0.24); g.strokeStyle = stroke;
  g.strokeText(s, x, y + size * 0.1);
  g.strokeText(s, x, y);
  g.fillStyle = fill; g.fillText(s, x, y);
}
function dropPath(g, x, y, r) {
  g.beginPath(); g.moveTo(x, y - r * 1.55);
  g.quadraticCurveTo(x + r * 1.05, y - r * 0.35, x + r, y + r * 0.1);
  g.arc(x, y + r * 0.1, r, 0, Math.PI);
  g.quadraticCurveTo(x - r * 1.05, y - r * 0.35, x, y - r * 1.55); g.closePath();
}
function drawDrop(g, x, y, r, num, size) {
  dropPath(g, x, y, r);
  const gr = g.createLinearGradient(x, y - r * 1.5, x, y + r);
  gr.addColorStop(0, '#ff9dff'); gr.addColorStop(0.5, '#d63cf2'); gr.addColorStop(1, '#8a17c4');
  g.fillStyle = gr; g.fill(); g.lineWidth = Math.max(1.5, r * 0.22); g.strokeStyle = OUT; g.stroke();
  HL(g, x - r * 0.35, y - r * 0.3, r * 0.18, r * 0.32, 0.6);
  if (num !== undefined) txt(g, String(num), x, y + r * 0.05, size || r * 1.3, '#fff');
}
function drawCrown(g, x, y, s, fill = '#ffd23f', empty = false) {
  g.save(); g.translate(x, y); g.lineJoin = 'round'; g.lineWidth = Math.max(1.5, s * 0.14); g.strokeStyle = OUT;
  P(g, [-s, s * 0.55, -s, -s * 0.35, -s * 0.5, s * 0.05, 0, -s * 0.7, s * 0.5, s * 0.05, s, -s * 0.35, s, s * 0.55], empty ? '#4a4060' : fill);
  if (!empty) { dot(g, 0, s * 0.18, s * 0.17, '#ff4a6a'); HL(g, -s * 0.45, s * 0.1, s * 0.18, s * 0.12, 0.5); }
  g.restore();
}

// =====================================================================
//  布局
// =====================================================================
let W, H, DPR, GW, GX, T, TH, OX, OY, UI_TOP, TOPY, SAT = 0, SAB = 0;
let bg = null;
const cardImg = {};
const UIL = {};
function sx(x) { return OX + x * T; }
function sy(y) { return OY + y * TH; }

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  const cs = getComputedStyle(document.getElementById('sa'));
  SAT = parseFloat(cs.paddingTop) || 0; SAB = parseFloat(cs.paddingBottom) || 0;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const availH = H - SAT - SAB;
  const K = (3.7 + ROWS * SQ + 0.25) / (COLS + 1) + 0.355;
  GW = Math.min(W, availH / K, 620);
  GX = (W - GW) / 2;
  T = GW / (COLS + 1); TH = T * SQ;
  TOPY = SAT + Math.max(0, (availH - GW * K) * 0.25);
  OX = GX + T * 0.5; OY = TOPY + T * 3.7;
  UI_TOP = OY + ROWS * TH + T * 0.25;
  // 卡牌区
  const avail = H - SAB - UI_TOP;
  const cw = clamp((avail - GW * 0.13) / 1.24, GW * 0.15, GW * 0.185), nw = GW * 0.125, gap = GW * 0.014;
  const tw = nw + gap * 2.2 + cw * 4 + gap * 3;
  const x0 = GX + (GW - tw) / 2;
  const ch = cw * 1.24, content = ch + GW * 0.03 + GW * 0.048;
  const cy = UI_TOP + Math.max(GW * 0.026, (avail - content) / 2);
  UIL.cards = [];
  for (let i = 0; i < 4; i++) UIL.cards.push({ x: x0 + nw + gap * 2.2 + i * (cw + gap), y: cy, w: cw, h: ch });
  UIL.next = { x: x0, y: cy + ch - nw * 1.24, w: nw, h: nw * 1.24 };
  const bx = x0 + nw + gap * 2.2 + GW * 0.055;
  UIL.bar = { x: bx, y: cy + ch + GW * 0.03, w: x0 + tw - bx, h: GW * 0.048 };
  UIL.cw = cw; UIL.ch = ch;
  buildBg();
  buildCards();
}

function drawTree(g, x, y, r) {
  g.lineWidth = r * 0.12; g.strokeStyle = OUT;
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(x + r * 0.2, y + r * 0.5, r * 0.9, r * 0.35, 0, 0, TAU); g.fill();
  RR(g, x - r * 0.15, y, r * 0.3, r * 0.5, r * 0.08, '#7a4b25');
  C(g, x - r * 0.45, y - r * 0.2, r * 0.55, '#2f8a3a');
  C(g, x + r * 0.45, y - r * 0.2, r * 0.55, '#2f8a3a');
  C(g, x, y - r * 0.65, r * 0.65, '#3aa046');
  HL(g, x - r * 0.2, y - r * 0.9, r * 0.25, r * 0.15, 0.3);
}
function drawBush(g, x, y, r) {

  }

    const pts = G.towers.filter(t => t.team === 0 && t.ttype === 'princess');

  g.fillStyle = `rgba(14,8,30,${0.6 * k})`; g.fillRect(0, 0, W, H);
  const cy = TOPY + GW * 0.45;
  const win = G.winner === 0, draw = G.winner === -1;
  const s = G.endT < 0.3 ? lerp(2.2, 1, G.endT / 0.3) : 1 + Math.sin(time * 3) * 0.02;
  g.save(); g.translate(W / 2, cy); g.scale(s, s);
  txt(g, draw ? '平 局' : win ? '胜 利 !' : '失 败', 0, 0, GW * 0.15, draw ? '#e0e0ff' : win ? '#ffd23f' : '#8fb8ff', 'center', OUT, GW * 0.035);
  g.restore();
  for (let i = 0; i < 3; i++) {
    const on = G.crowns[0] > i && G.endT > 0.5 + i * 0.35;
    const cs = GW * 0.075 * (on && G.endT < 0.7 + i * 0.35 ? 1.3 : 1);
    drawCrown(g, W / 2 + (i - 1) * GW * 0.2, cy + GW * 0.25, cs, '#ffd23f', !on);
  }
  txt(g, `你 ${G.crowns[0]}  :  ${G.crowns[1]} 电脑`, W / 2, cy + GW * 0.4, GW * 0.06, '#ffffff');
  if (G.endT > 0.8) {
    button('again', W / 2 - GW * 0.28, cy + GW * 0.55, GW * 0.56, GW * 0.14, '再来一局', 'yellow', GW * 0.06);
    button('menu', W / 2 - GW * 0.2, cy + GW * 0.75, GW * 0.4, GW * 0.1, '主菜单', 'blue', GW * 0.045);
  }
}

function render(time) {
  BTN = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1a1233'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (G.state === 'deck') { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawDeck(time); return; }
  const sh = G.shake > 0 ? G.shake * T * 0.35 : 0;
  const shx = sh ? rnd(-sh, sh) : 0, shy = sh ? rnd(-sh, sh) : 0;
  ctx.setTransform(DPR, 0, 0, DPR, shx * DPR, shy * DPR);
  ctx.drawImage(bg, 0, 0, W, H);
  drawWater(time);
  drawDecals();
  drawPlacement();
  for (const u of G.units) drawShadow(u);
  const list = [];
  for (const t of G.towers) list.push({ k: t.y + t.w * 0.25, f: () => drawTower(t, time) });
  for (const u of G.units) if (!u.d.air) list.push({ k: u.y, f: () => drawUnit(u, time) });
  list.sort((a, b) => a.k - b.k);
  for (const e of list) e.f();
  const airs = G.units.filter(u => u.d.air).sort((a, b) => a.y - b.y);
  for (const u of airs) drawUnit(u, time);
  drawBeams(time);
  for (const p of G.projs) drawProj(p);
  drawParticles();
  if (G.state !== 'menu') { for (const t of G.towers) drawTowerHP(t); for (const u of G.units) drawUnitHP(u); }
  drawTexts();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawCardsPanel(time);
  if (G.state !== 'menu') drawHUD();
  drawBanners();
  // 拖拽中的卡牌（在 UI 区）
  if (drag && !drag.inArena && drag.moved) {
    const cid = G.hand[0][drag.i];
    ctx.globalAlpha = 0.9; ctx.drawImage(cardImg[cid], drag.x - UIL.cw / 2, drag.y - UIL.ch * 0.7, UIL.cw, UIL.ch); ctx.globalAlpha = 1;
  }
  if (G.state === 'countdown') {
    const n = Math.ceil(G.cd);
    const f = G.cd - Math.floor(G.cd);
    const label = n > 3 ? '准备' : String(n);
    ctx.save(); ctx.translate(W / 2, sy(16)); const s = 1 + f * 0.6; ctx.scale(s, s); ctx.globalAlpha = Math.min(1, f * 3 + 0.2);
    txt(ctx, label, 0, 0, T * (n > 3 ? 1.4 : 2.4), '#ffffff', 'center', OUT, T * 0.4);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (G.state === 'play' && G.elapsed < 1.0) {
    ctx.globalAlpha = 1 - G.elapsed; txt(ctx, '开战!', W / 2, sy(16), T * 1.8, '#ffd23f', 'center', OUT, T * 0.35); ctx.globalAlpha = 1;
  }
  if (G.state === 'menu') drawMenu(time);
  if (G.state === 'end') drawEnd(time);
}

// =====================================================================
//  输入
// =====================================================================
function ptr(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hit(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function toWorld(p, touch) { return { wx: (p.x - OX) / T, wy: (p.y - OY) / TH - (touch ? 0.9 : 0) }; }
function tryDeployAt(i, p, touch) {
  const cid = G.hand[0][i];
  const { wx, wy } = toWorld(p, touch);
  const pos = adjustPlace(0, cid, wx, wy);
  if (!pos) { sfx('bad'); return false; }
  if (G.el[0] < CD[cid].cost) { G.barShake = 1; sfx('bad'); return false; }
  deploy(0, i, pos.x, pos.y);
  sel = null;
  return true;
}
function onButton(id) {
  sfx('card');
  if (id === 'play' || id === 'again') {
    if (!deckOK(decks[deckIdx])) { if (G.state === 'end') { newGame(menuDiff); } openDeck('卡组需要 8 张卡才能开战'); return; }
    newGame(menuDiff);
  }
  else if (id === 'menu') { newGame(menuDiff); G.state = 'menu'; }
  else if (id === 'mute') muted = !muted;
  else if (id.startsWith('diff_')) menuDiff = id.slice(5);
  else if (id === 'deck') openDeck();
  else if (id.startsWith('tab_')) { deckIdx = +id.slice(4); DK.pending = null; DK.deckSel = -1; DK.scroll = 0; DK.info = decks[deckIdx].find(Boolean) || DK.info; if (deckOK(decks[deckIdx])) saveDecks(); }
  else if (id === 'rand') { decks[deckIdx] = genDeck(); DK.pending = null; DK.deckSel = -1; saveDecks(); sfx('swap'); }
  else if (id === 'done') {
    if (!deckOK(decks[deckIdx])) { deckHint('卡组需要 8 张卡'); sfx('bad'); return; }
    saveDecks(); G.state = 'menu';
  }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  const p = ptr(e);
  for (const b of BTN) if (hit(b, p)) { onButton(b.id); return; }
  if (G && G.state === 'deck') {
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    DK.ptr = { x: p.x, y: p.y, sy: DK.scroll, moved: false, inColl: DK.coll && hit(DK.coll, p) };
    return;
  }
  if (!G || G.state !== 'play') return;
  for (let i = 0; i < 4; i++) {
    const r = UIL.cards[i]; const rr = { x: r.x, y: r.y - r.h * 0.15, w: r.w, h: r.h * 1.15 };
    if (hit(rr, p)) {
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      drag = { i, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false, inArena: false, wx: 0, wy: 0, touch: e.pointerType !== 'mouse' };
      sfx('card');
      return;
    }
  }
  if (sel !== null && p.y < UI_TOP) tryDeployAt(sel, p, false);
});
cv.addEventListener('pointermove', e => {
  if (DK.ptr) {
    const p = ptr(e), dy = p.y - DK.ptr.y;
    if (Math.hypot(p.x - DK.ptr.x, dy) > 9) DK.ptr.moved = true;
    if (DK.ptr.inColl && DK.ptr.moved) DK.scroll = clamp(DK.ptr.sy - dy, 0, DK.maxScroll);
    return;
  }
  if (!drag) return;
  const p = ptr(e);
  drag.x = p.x; drag.y = p.y;
  if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 10) drag.moved = true;
  drag.inArena = p.y < UI_TOP - T * 0.2;
  const w = toWorld(p, drag.touch); drag.wx = w.wx; drag.wy = w.wy;
});
function endDrag(e, cancel) {
  if (DK.ptr) { const d = DK.ptr; DK.ptr = null; if (!cancel && !d.moved && G.state === 'deck') deckTap(ptr(e)); return; }
  if (!drag) return;
  const p = ptr(e), d = drag; drag = null;
  if (cancel || !G || G.state !== 'play') return;
  if (p.y < UI_TOP - T * 0.2 && d.moved) { tryDeployAt(d.i, p, d.touch); }
  else if (!d.moved) { sel = sel === d.i ? null : d.i; }
}
cv.addEventListener('pointerup', e => endDrag(e, false));
cv.addEventListener('pointercancel', e => endDrag(e, true));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { if (G && G.state === 'deck') { DK.scroll = clamp(DK.scroll + e.deltaY, 0, DK.maxScroll); e.preventDefault(); } }, { passive: false });
window.addEventListener('keydown', e => {
  if (!G || G.state !== 'play') return;
  const n = parseInt(e.key, 10); if (n >= 1 && n <= 4) { sel = sel === n - 1 ? null : n - 1; sfx('card'); }
});

// =====================================================================
//  主循环
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { update(dt); render(now / 1000); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
let rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(layout, 120); });
loadDecks();
layout();
newGame(menuDiff); G.state = 'menu';
requestAnimationFrame(frame);

// 调试/测试钩子
window.RA = { get G() { return G; }, get decks() { return decks; }, DK, openDeck, deckTap, onButton, genDeck, deploy, newGame, update, adjustPlace, setSel: v => sel = v, layout: () => ({ OX, OY, T, TH, UI_TOP, UIL }) };
})();
</script>
</body>
</html>
