<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1233">
<title>皇家竞技场 · Royal Arena</title>
<style>
  html,body{margin:0;height:100%;background:#1a1233;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
'use strict';
(() => {
// =====================================================================
//  常量 & 数据
// =====================================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const COLS = 18, ROWS = 32, SQ = 0.86;          // 18x32 格竞技场，纵向略压缩营造俯视角
const BRIDGES = [3.5, 14.5];
const OUT = '#1d1528';
const SKIN = '#ffd1a8';
const TEAM = [
  { main: '#3f8cff', dark: '#1f4fb3', light: '#a9d4ff', hp: '#4aa8ff', name: '你' },
  { main: '#ff4d4d', dark: '#a8181f', light: '#ffb0b0', hp: '#ff4a4a', name: '电脑' },
];
const FONT = '"Arial Black","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif';

// 单位属性（数值参考同类游戏 1 级卡）
const UD = {
  knight:   { name: '骑士',   hp: 1450, dmg: 165, hs: 1.2, spd: 1.0,  range: 0.6, sight: 5.5, r: 0.42, tgt: 'ground',    size: 1.0,  mass: 6 },
  archer:   { name: '弓箭手', hp: 300,  dmg: 95,  hs: 1.0, spd: 1.0,  range: 5.0, sight: 5.5, r: 0.32, tgt: 'all',       size: 0.88, mass: 3, proj: 'arrow' },
  giant:    { name: '巨人',   hp: 3400, dmg: 210, hs: 1.5, spd: 0.75, range: 0.6, sight: 7.5, r: 0.7,  tgt: 'buildings', size: 1.5,  mass: 18 },
  skeleton: { name: '骷髅',   hp: 81,   dmg: 81,  hs: 1.0, spd: 1.4,  range: 0.4, sight: 5.0, r: 0.24, tgt: 'ground',    size: 0.62, mass: 1 },
  wizard:   { name: '法师',   hp: 640,  dmg: 240, hs: 1.4, spd: 1.0,  range: 5.5, sight: 5.5, r: 0.36, tgt: 'all',       size: 1.0,  mass: 4, proj: 'orb', splash: 1.5 },
  goblin:   { name: '哥布林', hp: 190,  dmg: 115, hs: 1.1, spd: 1.6,  range: 0.4, sight: 5.5, r: 0.3,  tgt: 'ground',    size: 0.8,  mass: 2 },
  dragon:   { name: '飞龙宝宝', hp: 1050, dmg: 150, hs: 1.5, spd: 1.35, range: 3.5, sight: 5.5, r: 0.5, tgt: 'all',      size: 1.05, mass: 5, air: true, proj: 'flame', splash: 1.2 },
  ironman:  { name: '铁甲武士', hp: 1300, dmg: 650, hs: 1.8, spd: 1.0, range: 0.6, sight: 5.0, r: 0.45, tgt: 'ground',  size: 1.12, mass: 7 },
};
const RAR = {
  common: { edge: '#cfe6ff', bg: ['#6fb6ff', '#2a5fc4'] },
  rare:   { edge: '#ffcf6b', bg: ['#ffb866', '#c2531f'] },
  epic:   { edge: '#e6b3ff', bg: ['#c886ff', '#5e25ad'] },
};
const CD = {
  knight:   { name: '骑士',     cost: 3, unit: 'knight',   n: 1,  rar: 'common' },
  archers:  { name: '弓箭手',   cost: 3, unit: 'archer',   n: 2,  rar: 'common' },
  giant:    { name: '巨人',     cost: 5, unit: 'giant',    n: 1,  rar: 'rare' },
  skarmy:   { name: '骷髅军团', cost: 3, unit: 'skeleton', n: 12, rar: 'epic' },
  fireball: { name: '火球',     cost: 4, spell: 'fireball', radius: 2.5, dmg: 580, tower: 0.35, rar: 'rare' },
  wizard:   { name: '法师',     cost: 5, unit: 'wizard',   n: 1,  rar: 'rare' },
  goblins:  { name: '哥布林',   cost: 2, unit: 'goblin',   n: 3,  rar: 'common' },
  dragon:   { name: '飞龙宝宝', cost: 4, unit: 'dragon',   n: 1,  rar: 'epic' },
  ironman:  { name: '铁甲武士', cost: 4, unit: 'ironman',  n: 1,  rar: 'epic' },
  arrows:   { name: '万箭齐发', cost: 3, spell: 'arrows', radius: 4, dmg: 270, tower: 0.35, rar: 'common' },
};
for (const k in CD) if (CD[k].unit) UD[CD[k].unit].value = CD[k].cost / CD[k].n;

const DECKS = [
  ['knight', 'archers', 'giant', 'skarmy', 'fireball', 'wizard', 'goblins', 'dragon'],
  ['knight', 'archers', 'giant', 'ironman', 'fireball', 'arrows', 'goblins', 'wizard'],
];
const DIFF = {
  easy:   { label: '简单', think: 1.6, push: 9.8, elMul: 0.85, smart: 0.55 },
  normal: { label: '普通', think: 0.95, push: 9.0, elMul: 1.0, smart: 0.85 },
  hard:   { label: '困难', think: 0.5, push: 8.0, elMul: 1.15, smart: 1.0 },
};
const TOWER_POS = [
  { team: 0, type: 'king', x: 9, y: 29 }, { team: 0, type: 'princess', x: 3.5, y: 25.5 }, { team: 0, type: 'princess', x: 14.5, y: 25.5 },
  { team: 1, type: 'king', x: 9, y: 3 },  { team: 1, type: 'princess', x: 3.5, y: 6.5 },  { team: 1, type: 'princess', x: 14.5, y: 6.5 },
];

// =====================================================================
//  工具
// =====================================================================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const TAU = Math.PI * 2;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let seed = 1;
const srnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// --- 绘图小工具（使用当前 lineWidth / strokeStyle） ---
function rrp(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function RR(g, x, y, w, h, r, f) { rrp(g, x, y, w, h, r); g.fillStyle = f; g.fill(); g.stroke(); }
function C(g, x, y, r, f) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = f; g.fill(); g.stroke(); }
function E(g, x, y, rx, ry, f, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fillStyle = f; g.fill(); g.stroke(); }
function P(g, pts, f) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fillStyle = f; g.fill(); g.stroke(); }
function HL(g, x, y, rx, ry, a = 0.45) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fillStyle = `rgba(255,255,255,${a})`; g.fill(); }
function dot(g, x, y, r, f) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = f; g.fill(); }
function line(g, x1, y1, x2, y2, w, col) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineWidth = w; g.strokeStyle = col; g.stroke(); }

function txt(g, s, x, y, size, fill = '#fff', align = 'center', stroke = OUT, lw) {
  g.font = `900 ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = lw ?? Math.max(2, size * 0.24); g.strokeStyle = stroke;
  g.strokeText(s, x, y + size * 0.1);
  g.strokeText(s, x, y);
  g.fillStyle = fill; g.fillText(s, x, y);
}
function dropPath(g, x, y, r) {
  g.beginPath(); g.moveTo(x, y - r * 1.55);
  g.quadraticCurveTo(x + r * 1.05, y - r * 0.35, x + r, y + r * 0.1);
  g.arc(x, y + r * 0.1, r, 0, Math.PI);
  g.quadraticCurveTo(x - r * 1.05, y - r * 0.35, x, y - r * 1.55); g.closePath();
}
function drawDrop(g, x, y, r, num, size) {
  dropPath(g, x, y, r);
  const gr = g.createLinearGradient(x, y - r * 1.5, x, y + r);
  gr.addColorStop(0, '#ff9dff'); gr.addColorStop(0.5, '#d63cf2'); gr.addColorStop(1, '#8a17c4');
  g.fillStyle = gr; g.fill(); g.lineWidth = Math.max(1.5, r * 0.22); g.strokeStyle = OUT; g.stroke();
  HL(g, x - r * 0.35, y - r * 0.3, r * 0.18, r * 0.32, 0.6);
  if (num !== undefined) txt(g, String(num), x, y + r * 0.05, size || r * 1.3, '#fff');
}
function drawCrown(g, x, y, s, fill = '#ffd23f', empty = false) {
  g.save(); g.translate(x, y); g.lineJoin = 'round'; g.lineWidth = Math.max(1.5, s * 0.14); g.strokeStyle = OUT;
  P(g, [-s, s * 0.55, -s, -s * 0.35, -s * 0.5, s * 0.05, 0, -s * 0.7, s * 0.5, s * 0.05, s, -s * 0.35, s, s * 0.55], empty ? '#4a4060' : fill);
  if (!empty) { dot(g, 0, s * 0.18, s * 0.17, '#ff4a6a'); HL(g, -s * 0.45, s * 0.1, s * 0.18, s * 0.12, 0.5); }
  g.restore();
}

// =====================================================================
//  布局
// =====================================================================
let W, H, DPR, GW, GX, T, TH, OX, OY, UI_TOP, TOPY, SAT = 0, SAB = 0;
let bg = null;
const cardImg = {};
const UIL = {};
function sx(x) { return OX + x * T; }
function sy(y) { return OY + y * TH; }

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  const cs = getComputedStyle(document.getElementById('sa'));
  SAT = parseFloat(cs.paddingTop) || 0; SAB = parseFloat(cs.paddingBottom) || 0;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const availH = H - SAT - SAB;
  const K = (3.7 + ROWS * SQ + 0.25) / (COLS + 1) + 0.355;
  GW = Math.min(W, availH / K, 620);
  GX = (W - GW) / 2;
  T = GW / (COLS + 1); TH = T * SQ;
  TOPY = SAT + Math.max(0, (availH - GW * K) * 0.25);
  OX = GX + T * 0.5; OY = TOPY + T * 3.7;
  UI_TOP = OY + ROWS * TH + T * 0.25;
  // 卡牌区
  const avail = H - SAB - UI_TOP;
  const cw = clamp((avail - GW * 0.13) / 1.24, GW * 0.15, GW * 0.185), nw = GW * 0.125, gap = GW * 0.014;
  const tw = nw + gap * 2.2 + cw * 4 + gap * 3;
  const x0 = GX + (GW - tw) / 2;
  const ch = cw * 1.24, content = ch + GW * 0.03 + GW * 0.048;
  const cy = UI_TOP + Math.max(GW * 0.026, (avail - content) / 2);
  UIL.cards = [];
  for (let i = 0; i < 4; i++) UIL.cards.push({ x: x0 + nw + gap * 2.2 + i * (cw + gap), y: cy, w: cw, h: ch });
  UIL.next = { x: x0, y: cy + ch - nw * 1.24, w: nw, h: nw * 1.24 };
  const bx = x0 + nw + gap * 2.2 + GW * 0.055;
  UIL.bar = { x: bx, y: cy + ch + GW * 0.03, w: x0 + tw - bx, h: GW * 0.048 };
  UIL.cw = cw; UIL.ch = ch;
  buildBg();
  buildCards();
}

// =====================================================================
//  背景（预渲染）
// =====================================================================
function drawTree(g, x, y, r) {
  g.lineWidth = r * 0.12; g.strokeStyle = OUT;
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(x + r * 0.2, y + r * 0.5, r * 0.9, r * 0.35, 0, 0, TAU); g.fill();
  RR(g, x - r * 0.15, y, r * 0.3, r * 0.5, r * 0.08, '#7a4b25');
  C(g, x - r * 0.45, y - r * 0.2, r * 0.55, '#2f8a3a');
  C(g, x + r * 0.45, y - r * 0.2, r * 0.55, '#2f8a3a');
  C(g, x, y - r * 0.65, r * 0.65, '#3aa046');
  HL(g, x - r * 0.2, y - r * 0.9, r * 0.25, r * 0.15, 0.3);
}
function drawBush(g, x, y, r) {
  g.lineWidth = r * 0.14; g.strokeStyle = OUT;
  C(g, x - r * 0.5, y, r * 0.55, '#3c9a3f'); C(g, x + r * 0.5, y, r * 0.55, '#3c9a3f'); C(g, x, y - r * 0.3, r * 0.65, '#4cb14c');
  dot(g, x + r * 0.2, y - r * 0.4, r * 0.12, '#ff7aa8'); dot(g, x - r * 0.4, y - r * 0.05, r * 0.1, '#fff27a');
}
function buildBg() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const g = bg.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.lineJoin = 'round'; g.lineCap = 'round';
  // 外围草地
  let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#3d7a32'); gr.addColorStop(1, '#25501f');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const ax0 = sx(0), ax1 = sx(COLS), ay0 = sy(0), ay1 = sy(ROWS);
  seed = 12345;
  // 外围小草
  for (let i = 0; i < 400; i++) { const x = srnd() * W, y = srnd() * UI_TOP; g.fillStyle = srnd() < 0.5 ? 'rgba(120,200,90,0.25)' : 'rgba(10,40,10,0.18)'; g.fillRect(x, y, T * 0.08, T * 0.18); }
  // 外围树木
  const step = T * 1.25;
  for (let y = -step; y < UI_TOP; y += step * 0.8) for (let x = -step; x < W + step; x += step) {
    const px = x + (srnd() - 0.5) * step * 0.6 + ((Math.round(y / step)) % 2) * step * 0.5, py = y + (srnd() - 0.5) * step * 0.5;
    if (px > ax0 - T * 0.9 && px < ax1 + T * 0.9 && py > ay0 - T * 1.2 && py < ay1 + T * 0.5) continue;
    if (py > UI_TOP - T * 0.6) continue;
    if (srnd() < 0.55) drawTree(g, px, py, T * (0.55 + srnd() * 0.3)); else drawBush(g, px, py, T * (0.35 + srnd() * 0.2));
  }
  // 石墙边框
  const rim = T * 0.32;
  g.lineWidth = T * 0.06; g.strokeStyle = OUT;
  RR(g, ax0 - rim, ay0 - rim, ax1 - ax0 + rim * 2, ay1 - ay0 + rim * 1.6, T * 0.15, '#9a9483');
  g.fillStyle = '#b7b19f'; g.fillRect(ax0 - rim * 0.7, ay0 - rim * 0.7, ax1 - ax0 + rim * 1.4, rim * 0.4);
  g.strokeStyle = 'rgba(50,40,30,0.35)'; g.lineWidth = T * 0.035;
  for (let y = ay0; y < ay1; y += TH * 0.7) {
    g.beginPath(); g.moveTo(ax0 - rim, y); g.lineTo(ax0, y); g.moveTo(ax1, y + TH * 0.35); g.lineTo(ax1 + rim, y + TH * 0.35); g.stroke();
  }
  // 棋盘草地
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    g.fillStyle = (r + c) % 2 ? '#86c94b' : '#7cc044';
    g.fillRect(sx(c), sy(r), T + 0.6, TH + 0.6);
  }
  // 草丛细节
  g.strokeStyle = 'rgba(60,120,30,0.55)'; g.lineWidth = T * 0.045;
  for (let i = 0; i < 260; i++) {
    const x = ax0 + srnd() * (ax1 - ax0), y = ay0 + srnd() * (ay1 - ay0); const s = T * 0.12;
    g.beginPath(); g.moveTo(x - s, y - s); g.lineTo(x, y); g.lineTo(x + s * 0.3, y - s * 1.3); g.moveTo(x, y); g.lineTo(x + s, y - s * 0.8); g.stroke();
  }
  for (let i = 0; i < 40; i++) {
    const x = ax0 + srnd() * (ax1 - ax0), y = ay0 + srnd() * (ay1 - ay0);
    dot(g, x, y, T * 0.06, srnd() < 0.5 ? '#ffffff' : '#ffe96b');
  }
  // 边缘阴影
  gr = g.createLinearGradient(ax0, 0, ax0 + T * 1.2, 0); gr.addColorStop(0, 'rgba(0,30,0,0.28)'); gr.addColorStop(1, 'rgba(0,30,0,0)');
  g.fillStyle = gr; g.fillRect(ax0, ay0, T * 1.2, ay1 - ay0);
  gr = g.createLinearGradient(ax1, 0, ax1 - T * 1.2, 0); gr.addColorStop(0, 'rgba(0,30,0,0.28)'); gr.addColorStop(1, 'rgba(0,30,0,0)');
  g.fillStyle = gr; g.fillRect(ax1 - T * 1.2, ay0, T * 1.2, ay1 - ay0);
  gr = g.createLinearGradient(0, ay0, 0, ay0 + T); gr.addColorStop(0, 'rgba(0,30,0,0.3)'); gr.addColorStop(1, 'rgba(0,30,0,0)');
  g.fillStyle = gr; g.fillRect(ax0, ay0, ax1 - ax0, T);
  // 塔基石板
  for (const p of TOWER_POS) {
    const w = p.type === 'king' ? 4 : 3, m = 0.45;
    const x = sx(p.x - w / 2 - m), y = sy(p.y - w / 2 - m), ww = (w + m * 2) * T, hh = (w + m * 2) * TH;
    g.lineWidth = T * 0.06; g.strokeStyle = 'rgba(30,25,20,0.6)';
    RR(g, x, y, ww, hh, T * 0.25, '#c4bba5');
    g.strokeStyle = 'rgba(110,100,80,0.45)'; g.lineWidth = T * 0.035;
    for (let i = 1; i < (w + m * 2) / 0.75; i++) { g.beginPath(); g.moveTo(x + i * T * 0.75, y + T * 0.1); g.lineTo(x + i * T * 0.75, y + hh - T * 0.1); g.stroke(); }
    for (let j = 1; j < (w + m * 2) / 0.75; j++) { g.beginPath(); g.moveTo(x + T * 0.1, y + j * TH * 0.75); g.lineTo(x + ww - T * 0.1, y + j * TH * 0.75); g.stroke(); }
  }
  // 河流
  const ry0 = sy(15), ry1 = sy(17);
  g.fillStyle = '#4c8a2c'; g.fillRect(ax0, ry0 - TH * 0.18, ax1 - ax0, TH * 0.18);
  gr = g.createLinearGradient(0, ry0, 0, ry1); gr.addColorStop(0, '#1f74c9'); gr.addColorStop(0.5, '#3a9df0'); gr.addColorStop(1, '#5cc0ff');
  g.fillStyle = gr; g.fillRect(ax0 - T * 0.32, ry0, ax1 - ax0 + T * 0.64, ry1 - ry0);
  g.fillStyle = 'rgba(0,30,80,0.25)'; g.fillRect(ax0 - T * 0.32, ry0, ax1 - ax0 + T * 0.64, TH * 0.25);
  // 河岸石头
  g.lineWidth = T * 0.04; g.strokeStyle = OUT;
  for (const yy of [15, 17]) for (let x = -0.2; x < COLS + 0.2; x += 0.42) {
    if (BRIDGES.some(b => Math.abs(x - b) < 1.3)) continue;
    const r = T * (0.17 + srnd() * 0.08);
    E(g, sx(x), sy(yy) + (yy === 15 ? -TH * 0.02 : TH * 0.02), r, r * 0.65, srnd() < 0.5 ? '#a9adb3' : '#c3c6cb');
  }
  // 桥
  for (const b of BRIDGES) drawBridge(g, b);
}
function drawBridge(g, b) {
  const x0 = sx(b - 1.2), x1 = sx(b + 1.2), y0 = sy(14.65), y1 = sy(17.35);
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x0 + T * 0.15, y0 + T * 0.15, x1 - x0, y1 - y0);
  const n = 8, ph = (y1 - y0) / n;
  g.lineWidth = T * 0.045; g.strokeStyle = OUT;
  for (let i = 0; i < n; i++) {
    g.fillStyle = i % 2 ? '#b57e45' : '#c48c51';
    g.fillRect(x0 + T * 0.18, y0 + i * ph, x1 - x0 - T * 0.36, ph);
    g.strokeRect(x0 + T * 0.18, y0 + i * ph, x1 - x0 - T * 0.36, ph);
    g.fillStyle = 'rgba(80,40,10,0.6)';
    dot(g, x0 + T * 0.4, y0 + i * ph + ph / 2, T * 0.04, 'rgba(80,40,10,0.7)');
    dot(g, x1 - T * 0.4, y0 + i * ph + ph / 2, T * 0.04, 'rgba(80,40,10,0.7)');
  }
  // 栏杆
  for (const rx of [x0, x1 - T * 0.24]) {
    g.lineWidth = T * 0.05;
    RR(g, rx, y0 - T * 0.1, T * 0.24, y1 - y0 + T * 0.2, T * 0.06, '#7c4a22');

  if (!G || G.state === 'menu') return;
  const el = G.el[0];
  // 下一张
  const n = UIL.next;
  txt(g, '下一张', n.x + n.w / 2, n.y - T * 0.35, T * 0.3, '#d9cfff');
  g.globalAlpha = 0.9; g.drawImage(cardImg[G.queue[0][0]], n.x, n.y, n.w, n.h); g.globalAlpha = 1;
  // 手牌
  for (let i = 0; i < 4; i++) {
    const r = UIL.cards[i], cid = G.hand[0][i], cd = CD[cid];
    const lifted = sel === i || (drag && drag.i === i);
    const y = r.y - (lifted ? r.h * 0.12 : 0);
    if (drag && drag.i === i && drag.inArena) { g.globalAlpha = 0.35; }
    if (lifted) { g.fillStyle = 'rgba(255,240,140,0.55)'; rrp(g, r.x - 4, y - 4, r.w + 8, r.h + 8, r.w * 0.13); g.fill(); }
    g.drawImage(cardImg[cid], r.x, y, r.w, r.h);
    if (el < cd.cost) {
      g.fillStyle = 'rgba(15,8,30,0.55)'; rrp(g, r.x, y, r.w, r.h, r.w * 0.1); g.fill();
      const f = el / cd.cost;
      g.fillStyle = 'rgba(214,60,242,0.25)'; g.fillRect(r.x + 3, y + r.h * (1 - f), r.w - 6, r.h * f - 3);
    }
    drawDrop(g, r.x + r.w * 0.17, y + r.h * 0.15, r.w * 0.12, cd.cost, r.w * 0.2);
    g.globalAlpha = 1;
  }
  // 圣水条
  const b = UIL.bar, shx = G.barShake > 0 ? Math.sin(time * 60) * G.barShake * 6 : 0;
  const bx = b.x + shx;
  g.lineWidth = 3; g.strokeStyle = OUT;
  RR(g, bx, b.y, b.w, b.h, b.h * 0.35, '#1c1030');
  const fw = b.w * el / 10;
  if (fw > 2) {
    g.save(); rrp(g, bx, b.y, b.w, b.h, b.h * 0.35); g.clip();
    const eg = g.createLinearGradient(0, b.y, 0, b.y + b.h); eg.addColorStop(0, '#ff9dff'); eg.addColorStop(0.45, '#d63cf2'); eg.addColorStop(1, '#8417bf');
    g.fillStyle = eg; g.fillRect(bx, b.y, fw, b.h);
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(bx, b.y + b.h * 0.12, fw, b.h * 0.22);
    if (G.dbl) { g.fillStyle = 'rgba(255,255,255,0.25)'; const sx2 = bx + ((time * 220) % (b.w + 60)) - 60; g.fillRect(sx2, b.y, 30, b.h); }
    g.restore();
  }
  g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 2;
  for (let i = 1; i < 10; i++) { const x = bx + b.w * i / 10; g.beginPath(); g.moveTo(x, b.y + 3); g.lineTo(x, b.y + b.h - 3); g.stroke(); }
  g.lineWidth = 3; g.strokeStyle = OUT; rrp(g, bx, b.y, b.w, b.h, b.h * 0.35); g.stroke();
  drawDrop(g, bx - b.h * 0.55, b.y + b.h * 0.55, b.h * 0.62, Math.floor(el), b.h * 0.75);
  if (G.barShake > 0) txt(g, '圣水不足!', b.x + b.w / 2, b.y - T * 0.45, T * 0.42, '#ff8af5');
}
function drawBanners() {
  for (const b of G.banners) {
    const k = b.t / b.dur, s = b.t < 0.2 ? lerp(1.8, 1, b.t / 0.2) : 1;
    const a = k > 0.8 ? (1 - k) / 0.2 : 1;
    const y = sy(16);
    ctx.globalAlpha = a;
    const gr = ctx.createLinearGradient(0, y - T, 0, y + T); gr.addColorStop(0, 'rgba(20,10,40,0)'); gr.addColorStop(0.3, 'rgba(20,10,40,0.75)'); gr.addColorStop(0.7, 'rgba(20,10,40,0.75)'); gr.addColorStop(1, 'rgba(20,10,40,0)');
    ctx.fillStyle = gr; ctx.fillRect(GX, y - T * 1.3, GW, T * 2.6);
    ctx.save(); ctx.translate(W / 2, y - T * 0.25); ctx.scale(s, s);
    txt(ctx, b.text, 0, 0, T * 1.1, b.color); ctx.restore();
    if (b.sub) txt(ctx, b.sub, W / 2, y + T * 0.75, T * 0.38, '#ffffff');
    ctx.globalAlpha = 1;
  }
}
function drawMenu(time) {
  const g = ctx;
  g.fillStyle = 'rgba(14,8,30,0.55)'; g.fillRect(0, 0, W, H);
  const cy = TOPY + GW * 0.38;
  const s = 1 + Math.sin(time * 2) * 0.02;
  g.save(); g.translate(W / 2, cy); g.scale(s, s);
  drawCrown(g, 0, -GW * 0.16, GW * 0.07);
  txt(g, '皇家竞技场', 0, 0, GW * 0.12, '#ffd23f', 'center', OUT, GW * 0.03);
  g.restore();
  txt(g, 'ROYAL  ARENA', W / 2, cy + GW * 0.1, GW * 0.045, '#cfe6ff');
  txt(g, '选择难度', W / 2, cy + GW * 0.3, GW * 0.045, '#ffffff');
  const keys = ['easy', 'normal', 'hard'], bw = GW * 0.25, gap = GW * 0.03, bx0 = W / 2 - (bw * 3 + gap * 2) / 2;
  keys.forEach((k, i) => button('diff_' + k, bx0 + i * (bw + gap), cy + GW * 0.36, bw, GW * 0.11, DIFF[k].label, menuDiff === k ? 'blue' : 'gray', GW * 0.045));
  const pb = GW * 0.56, ph = GW * 0.17;
  const pulse = 1 + Math.sin(time * 4) * 0.025;
  g.save(); g.translate(W / 2, cy + GW * 0.66); g.scale(pulse, pulse); g.translate(-W / 2, -(cy + GW * 0.66));
  button('play', W / 2 - pb / 2, cy + GW * 0.58, pb, ph, '对 战 !', 'yellow', GW * 0.075);
  g.restore();
  button('mute', W / 2 - GW * 0.15, cy + GW * 0.84, GW * 0.3, GW * 0.08, muted ? '音效：关' : '音效：开', 'purple', GW * 0.035);
  const hy = cy + GW * 1.0;
  txt(g, '拖动卡牌到己方半场放置部队', W / 2, hy, GW * 0.036, '#ffffff');
  txt(g, '摧毁敌方防御塔赢得皇冠 · 国王塔被毁即胜', W / 2, hy + GW * 0.055, GW * 0.032, '#d9cfff');
}
function drawEnd(time) {
  const g = ctx, k = Math.min(1, G.endT / 0.4);
  g.fillStyle = `rgba(14,8,30,${0.6 * k})`; g.fillRect(0, 0, W, H);
  const cy = TOPY + GW * 0.45;
  const win = G.winner === 0, draw = G.winner === -1;
  const s = G.endT < 0.3 ? lerp(2.2, 1, G.endT / 0.3) : 1 + Math.sin(time * 3) * 0.02;
  g.save(); g.translate(W / 2, cy); g.scale(s, s);
  txt(g, draw ? '平 局' : win ? '胜 利 !' : '失 败', 0, 0, GW * 0.15, draw ? '#e0e0ff' : win ? '#ffd23f' : '#8fb8ff', 'center', OUT, GW * 0.035);
  g.restore();
  for (let i = 0; i < 3; i++) {
    const on = G.crowns[0] > i && G.endT > 0.5 + i * 0.35;
    const cs = GW * 0.075 * (on && G.endT < 0.7 + i * 0.35 ? 1.3 : 1);
    drawCrown(g, W / 2 + (i - 1) * GW * 0.2, cy + GW * 0.25, cs, '#ffd23f', !on);
  }
  txt(g, `你 ${G.crowns[0]}  :  ${G.crowns[1]} 电脑`, W / 2, cy + GW * 0.4, GW * 0.06, '#ffffff');
  if (G.endT > 0.8) {
    button('again', W / 2 - GW * 0.28, cy + GW * 0.55, GW * 0.56, GW * 0.14, '再来一局', 'yellow', GW * 0.06);
    button('menu', W / 2 - GW * 0.2, cy + GW * 0.75, GW * 0.4, GW * 0.1, '主菜单', 'blue', GW * 0.045);
  }
}

function render(time) {
  BTN = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1a1233'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = G.shake > 0 ? G.shake * T * 0.35 : 0;
  const shx = sh ? rnd(-sh, sh) : 0, shy = sh ? rnd(-sh, sh) : 0;
  ctx.setTransform(DPR, 0, 0, DPR, shx * DPR, shy * DPR);
  ctx.drawImage(bg, 0, 0, W, H);
  drawWater(time);
  drawDecals();
  drawPlacement();
  for (const u of G.units) drawShadow(u);
  const list = [];
  for (const t of G.towers) list.push({ k: t.y + t.w * 0.25, f: () => drawTower(t, time) });
  for (const u of G.units) if (!u.d.air) list.push({ k: u.y, f: () => drawUnit(u, time) });
  list.sort((a, b) => a.k - b.k);
  for (const e of list) e.f();
  const airs = G.units.filter(u => u.d.air).sort((a, b) => a.y - b.y);
  for (const u of airs) drawUnit(u, time);
  for (const p of G.projs) drawProj(p);
  drawParticles();
  if (G.state !== 'menu') { for (const t of G.towers) drawTowerHP(t); for (const u of G.units) drawUnitHP(u); }
  drawTexts();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawCardsPanel(time);
  if (G.state !== 'menu') drawHUD();
  drawBanners();
  // 拖拽中的卡牌（在 UI 区）
  if (drag && !drag.inArena && drag.moved) {
    const cid = G.hand[0][drag.i];
    ctx.globalAlpha = 0.9; ctx.drawImage(cardImg[cid], drag.x - UIL.cw / 2, drag.y - UIL.ch * 0.7, UIL.cw, UIL.ch); ctx.globalAlpha = 1;
  }
  if (G.state === 'countdown') {
    const n = Math.ceil(G.cd);
    const f = G.cd - Math.floor(G.cd);
    const label = n > 3 ? '准备' : String(n);
    ctx.save(); ctx.translate(W / 2, sy(16)); const s = 1 + f * 0.6; ctx.scale(s, s); ctx.globalAlpha = Math.min(1, f * 3 + 0.2);
    txt(ctx, label, 0, 0, T * (n > 3 ? 1.4 : 2.4), '#ffffff', 'center', OUT, T * 0.4);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (G.state === 'play' && G.elapsed < 1.0) {
    ctx.globalAlpha = 1 - G.elapsed; txt(ctx, '开战!', W / 2, sy(16), T * 1.8, '#ffd23f', 'center', OUT, T * 0.35); ctx.globalAlpha = 1;
  }
  if (G.state === 'menu') drawMenu(time);
  if (G.state === 'end') drawEnd(time);
}

// =====================================================================
//  输入
// =====================================================================
function ptr(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hit(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function toWorld(p, touch) { return { wx: (p.x - OX) / T, wy: (p.y - OY) / TH - (touch ? 0.9 : 0) }; }
function tryDeployAt(i, p, touch) {
  const cid = G.hand[0][i];
  const { wx, wy } = toWorld(p, touch);
  const pos = adjustPlace(0, cid, wx, wy);
  if (!pos) { sfx('bad'); return false; }
  if (G.el[0] < CD[cid].cost) { G.barShake = 1; sfx('bad'); return false; }
  deploy(0, i, pos.x, pos.y);
  sel = null;
  return true;
}
function onButton(id) {
  sfx('card');
  if (id === 'play' || id === 'again') { newGame(menuDiff); }
  else if (id === 'menu') { newGame(menuDiff); G.state = 'menu'; }
  else if (id === 'mute') muted = !muted;
  else if (id.startsWith('diff_')) menuDiff = id.slice(5);
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  const p = ptr(e);
  for (const b of BTN) if (hit(b, p)) { onButton(b.id); return; }
  if (!G || G.state !== 'play') return;
  for (let i = 0; i < 4; i++) {
    const r = UIL.cards[i]; const rr = { x: r.x, y: r.y - r.h * 0.15, w: r.w, h: r.h * 1.15 };
    if (hit(rr, p)) {
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      drag = { i, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false, inArena: false, wx: 0, wy: 0, touch: e.pointerType !== 'mouse' };
      sfx('card');
      return;
    }
  }
  if (sel !== null && p.y < UI_TOP) tryDeployAt(sel, p, false);
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = ptr(e);
  drag.x = p.x; drag.y = p.y;
  if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 10) drag.moved = true;
  drag.inArena = p.y < UI_TOP - T * 0.2;
  const w = toWorld(p, drag.touch); drag.wx = w.wx; drag.wy = w.wy;
});
function endDrag(e, cancel) {
  if (!drag) return;
  const p = ptr(e), d = drag; drag = null;
  if (cancel || !G || G.state !== 'play') return;
  if (p.y < UI_TOP - T * 0.2 && d.moved) { tryDeployAt(d.i, p, d.touch); }
  else if (!d.moved) { sel = sel === d.i ? null : d.i; }
}
cv.addEventListener('pointerup', e => endDrag(e, false));
cv.addEventListener('pointercancel', e => endDrag(e, true));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (!G || G.state !== 'play') return;
  const n = parseInt(e.key, 10); if (n >= 1 && n <= 4) { sel = sel === n - 1 ? null : n - 1; sfx('card'); }
});

// =====================================================================
//  主循环
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { update(dt); render(now / 1000); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
let rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(layout, 120); });
layout();
newGame(menuDiff); G.state = 'menu';
requestAnimationFrame(frame);

// 调试/测试钩子
window.RA = { get G() { return G; }, deploy, newGame, update, adjustPlace, setSel: v => sel = v, layout: () => ({ OX, OY, T, TH, UI_TOP, UIL }) };
})();
</script>
</body>
</html>
