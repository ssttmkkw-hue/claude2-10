const DESC = {

};
// 卡组存档
let decks, deckIdx = 0;
function loadDecks() {
  decks = DEFAULT_DECKS.map(d => d.slice());
  try {
    const s = JSON.parse(localStorage.getItem('ra_decks_v1') || 'null');
    if (s && Array.isArray(s.decks) && s.decks.length === 3) {
      s.decks.forEach((d, i) => { if (Array.isArray(d) && d.length === 8 && d.every(c => CD[c]) && new Set(d).size === 8) decks[i] = d; });
      deckIdx = clamp(s.idx | 0, 0, 2);
    }
  } catch (e) {}
}
function saveDecks() { try { localStorage.setItem('ra_decks_v1', JSON.stringify({ decks, idx: deckIdx })); } catch (e) {} }

// =====================================================================
//  工具
// =====================================================================
let seed = 1;
const srnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// --- 绘图小工具（使用当前 lineWidth / strokeStyle） ---
function rrp(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function RR(g, x, y, w, h, r, f) { rrp(g, x, y, w, h, r); g.fillStyle = f; g.fill(); g.stroke(); }
function C(g, x, y, r, f) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = f; g.fill(); g.stroke(); }
function E(g, x, y, rx, ry, f, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fillStyle = f; g.fill(); g.stroke(); }
function P(g, pts, f) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fillStyle = f; g.fill(); g.stroke(); }
function HL(g, x, y, rx, ry, a = 0.45) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fillStyle = `rgba(255,255,255,${a})`; g.fill(); }
function dot(g, x, y, r, f) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = f; g.fill(); }
function line(g, x1, y1, x2, y2, w, col) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineWidth = w; g.strokeStyle = col; g.stroke(); }

function txt(g, s, x, y, size, fill = '#fff', align = 'center', stroke = OUT, lw) {
  g.font = `900 ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = lw ?? Math.max(2, size * 0.24); g.strokeStyle = stroke;
  g.strokeText(s, x, y + size * 0.1);
  g.strokeText(s, x, y);
  g.fillStyle = fill; g.fillText(s, x, y);
}
function dropPath(g, x, y, r) {
  g.beginPath(); g.moveTo(x, y - r * 1.55);
  g.quadraticCurveTo(x + r * 1.05, y - r * 0.35, x + r, y + r * 0.1);
  g.arc(x, y + r * 0.1, r, 0, Math.PI);
  g.quadraticCurveTo(x - r * 1.05, y - r * 0.35, x, y - r * 1.55); g.closePath();
}
function drawDrop(g, x, y, r, num, size) {
  dropPath(g, x, y, r);
  const gr = g.createLinearGradient(x, y - r * 1.5, x, y + r);
  gr.addColorStop(0, '#ff9dff'); gr.addColorStop(0.5, '#d63cf2'); gr.addColorStop(1, '#8a17c4');
  g.fillStyle = gr; g.fill(); g.lineWidth = Math.max(1.5, r * 0.22); g.strokeStyle = OUT; g.stroke();
  HL(g, x - r * 0.35, y - r * 0.3, r * 0.18, r * 0.32, 0.6);
  if (num !== undefined) txt(g, String(num), x, y + r * 0.05, size || r * 1.3, '#fff');
}
function drawCrown(g, x, y, s, fill = '#ffd23f', empty = false) {
  g.save(); g.translate(x, y); g.lineJoin = 'round'; g.lineWidth = Math.max(1.5, s * 0.14); g.strokeStyle = OUT;
  P(g, [-s, s * 0.55, -s, -s * 0.35, -s * 0.5, s * 0.05, 0, -s * 0.7, s * 0.5, s * 0.05, s, -s * 0.35, s, s * 0.55], empty ? '#4a4060' : fill);
  if (!empty) { dot(g, 0, s * 0.18, s * 0.17, '#ff4a6a'); HL(g, -s * 0.45, s * 0.1, s * 0.18, s * 0.12, 0.5); }
  g.restore();
}

// =====================================================================
//  布局
// =====================================================================
let W, H, DPR, GW, GX, T, TH, OX, OY, UI_TOP, TOPY, SAT = 0, SAB = 0;
let bg = null;
const cardImg = {};
const UIL = {};
function sx(x) { return OX + x * T; }
function sy(y) { return OY + y * TH; }

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  const cs = getComputedStyle(document.getElementById('sa'));
  SAT = parseFloat(cs.paddingTop) || 0; SAB = parseFloat(cs.paddingBottom) || 0;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const availH = H - SAT - SAB;
  const K = (3.7 + ROWS * SQ + 0.25) / (COLS + 1) + 0.355;
  GW = Math.min(W, availH / K, 620);
  GX = (W - GW) / 2;
  T = GW / (COLS + 1); TH = T * SQ;
  TOPY = SAT + Math.max(0, (availH - GW * K) * 0.25);
  OX = GX + T * 0.5; OY = TOPY + T * 3.7;
  UI_TOP = OY + ROWS * TH + T * 0.25;
  // 卡牌区
  const avail = H - SAB - UI_TOP;
  const cw = clamp((avail - GW * 0.13) / 1.24, GW * 0.15, GW * 0.185), nw = GW * 0.125, gap = GW * 0.014;
  const tw = nw + gap * 2.2 + cw * 4 + gap * 3;
  const x0 = GX + (GW - tw) / 2;
  const ch = cw * 1.24, content = ch + GW * 0.03 + GW * 0.048;
  const cy = UI_TOP + Math.max(GW * 0.026, (avail - content) / 2);
  UIL.cards = [];
  for (let i = 0; i < 4; i++) UIL.cards.push({ x: x0 + nw + gap * 2.2 + i * (cw + gap), y: cy, w: cw, h: ch });
  UIL.next = { x: x0, y: cy + ch - nw * 1.24, w: nw, h: nw * 1.24 };
  const bx = x0 + nw + gap * 2.2 + GW * 0.055;
  UIL.bar = { x: bx, y: cy + ch + GW * 0.03, w: x0 + tw - bx, h: GW * 0.048 };
  UIL.cw = cw; UIL.ch = ch;
  buildBg();
  buildCards();
}

// =====================================================================
//  背景（预渲染）
// =====================================================================
function drawTree(g, x, y, r) {
  g.lineWidth = r * 0.12; g.strokeStyle = OUT;
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(x + r * 0.2, y + r * 0.5, r * 0.9, r * 0.35, 0, 0, TAU); g.fill();
  RR(g, x - r * 0.15, y, r * 0.3, r * 0.5, r * 0.08, '#7a4b25');
  C(g, x - r * 0.45, y - r * 0.2, r * 0.55, '#2f8a3a');
  C(g, x + r * 0.45, y - r * 0.2, r * 0.55, '#2f8a3a');
  C(g, x, y - r * 0.65, r * 0.65, '#3aa046');
  HL(g, x - r * 0.2, y - r * 0.9, r * 0.25, r * 0.15, 0.3);
}
function drawBush(g, x, y, r) {
  g.lineWidth = r * 0.14; g.strokeStyle = OUT;
  C(g, x - r * 0.5, y, r * 0.55, '#3c9a3f'); C(g, x + r * 0.5, y, r * 0.55, '#3c9a3f'); C(g, x, y - r * 0.3, r * 0.65, '#4cb14c');
  dot(g, x + r * 0.2, y - r * 0.4, r * 0.12, '#ff7aa8'); dot(g, x - r * 0.4, y - r * 0.05, r * 0.1, '#fff27a');
}
function buildBg() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const g = bg.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.lineJoin = 'round'; g.lineCap = 'round';
  // 外围草地
  let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#3d7a32'); gr.addColorStop(1, '#25501f');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const ax0 = sx(0), ax1 = sx(COLS), ay0 = sy(0), ay1 = sy(ROWS);
  seed = 12345;
  // 外围小草
  for (let i = 0; i < 400; i++) { const x = srnd() * W, y = srnd() * UI_TOP; g.fillStyle = srnd() < 0.5 ? 'rgba(120,200,90,0.25)' : 'rgba(10,40,10,0.18)'; g.fillRect(x, y, T * 0.08, T * 0.18); }
  // 外围树木
  const step = T * 1.25;
  for (let y = -step; y < UI_TOP; y += step * 0.8) for (let x = -step; x < W + step; x += step) {
    const px = x + (srnd() - 0.5) * step * 0.6 + ((Math.round(y / step)) % 2) * step * 0.5, py = y + (srnd() - 0.5) * step * 0.5;
    if (px > ax0 - T * 0.9 && px < ax1 + T * 0.9 && py > ay0 - T * 1.2 && py < ay1 + T * 0.5) continue;
    if (py > UI_TOP - T * 0.6) continue;
    if (srnd() < 0.55) drawTree(g, px, py, T * (0.55 + srnd() * 0.3)); else drawBush(g, px, py, T * (0.35 + srnd() * 0.2));
  }
  // 石墙边框
  const rim = T * 0.32;
  g.lineWidth = T * 0.06; g.strokeStyle = OUT;
  RR(g, ax0 - rim, ay0 - rim, ax1 - ax0 + rim * 2, ay1 - ay0 + rim * 1.6, T * 0.15, '#9a9483');
  g.fillStyle = '#b7b19f'; g.fillRect(ax0 - rim * 0.7, ay0 - rim * 0.7, ax1 - ax0 + rim * 1.4, rim * 0.4);
  g.strokeStyle = 'rgba(50,40,30,0.35)'; g.lineWidth = T * 0.035;
  for (let y = ay0; y < ay1; y += TH * 0.7) {
    g.beginPath(); g.moveTo(ax0 - rim, y); g.lineTo(ax0, y); g.moveTo(ax1, y + TH * 0.35); g.lineTo(ax1 + rim, y + TH * 0.35); g.stroke();
  }
  // 棋盘草地
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    g.fillStyle = (r + c) % 2 ? '#86c94b' : '#7cc044';
    g.fillRect(sx(c), sy(r), T + 0.6, TH + 0.6);
  }
  // 草丛细节
  g.strokeStyle = 'rgba(60,120,30,0.55)'; g.lineWidth = T * 0.045;
  for (let i = 0; i < 260; i++) {
    const x = ax0 + srnd() * (ax1 - ax0), y = ay0 + srnd() * (ay1 - ay0); const s = T * 0.12;
    g.beginPath(); g.moveTo(x - s, y - s); g.lineTo(x, y); g.lineTo(x + s * 0.3, y - s * 1.3); g.moveTo(x, y); g.lineTo(x + s, y - s * 0.8); g.stroke();
  }
  for (let i = 0; i < 40; i++) {
    const x = ax0 + srnd() * (ax1 - ax0), y = ay0 + srnd() * (ay1 - ay0);
    dot(g, x, y, T * 0.06, srnd() < 0.5 ? '#ffffff' : '#ffe96b');
  }
  // 边缘阴影
  gr = g.createLinearGradient(ax0, 0, ax0 + T * 1.2, 0); gr.addColorStop(0, 'rgba(0,30,0,0.28)'); gr.addColorStop(1, 'rgba(0,30,0,0)');
  g.fillStyle = gr; g.fillRect(ax0, ay0, T * 1.2, ay1 - ay0);
  gr = g.createLinearGradient(ax1, 0, ax1 - T * 1.2, 0); gr.addColorStop(0, 'rgba(0,30,0,0.28)'); gr.addColorStop(1, 'rgba(0,30,0,0)');
  g.fillStyle = gr; g.fillRect(ax1 - T * 1.2, ay0, T * 1.2, ay1 - ay0);
  gr = g.createLinearGradient(0, ay0, 0, ay0 + T); gr.addColorStop(0, 'rgba(0,30,0,0.3)'); gr.addColorStop(1, 'rgba(0,30,0,0)');
  g.fillStyle = gr; g.fillRect(ax0, ay0, ax1 - ax0, T);
  // 塔基石板
  for (const p of TOWER_POS) {
    const w = p.type === 'king' ? 4 : 3, m = 0.45;
    const x = sx(p.x - w / 2 - m), y = sy(p.y - w / 2 - m), ww = (w + m * 2) * T, hh = (w + m * 2) * TH;
    g.lineWidth = T * 0.06; g.strokeStyle = 'rgba(30,25,20,0.6)';
    RR(g, x, y, ww, hh, T * 0.25, '#c4bba5');
    g.strokeStyle = 'rgba(110,100,80,0.45)'; g.lineWidth = T * 0.035;
    for (let i = 1; i < (w + m * 2) / 0.75; i++) { g.beginPath(); g.moveTo(x + i * T * 0.75, y + T * 0.1); g.lineTo(x + i * T * 0.75, y + hh - T * 0.1); g.stroke(); }
    for (let j = 1; j < (w + m * 2) / 0.75; j++) { g.beginPath(); g.moveTo(x + T * 0.1, y + j * TH * 0.75); g.lineTo(x + ww - T * 0.1, y + j * TH * 0.75); g.stroke(); }
  }
  // 河流
  const ry0 = sy(15), ry1 = sy(17);
  g.fillStyle = '#4c8a2c'; g.fillRect(ax0, ry0 - TH * 0.18, ax1 - ax0, TH * 0.18);
  gr = g.createLinearGradient(0, ry0, 0, ry1); gr.addColorStop(0, '#1f74c9'); gr.addColorStop(0.5, '#3a9df0'); gr.addColorStop(1, '#5cc0ff');
  g.fillStyle = gr; g.fillRect(ax0 - T * 0.32, ry0, ax1 - ax0 + T * 0.64, ry1 - ry0);
  g.fillStyle = 'rgba(0,30,80,0.25)'; g.fillRect(ax0 - T * 0.32, ry0, ax1 - ax0 + T * 0.64, TH * 0.25);
  // 河岸石头
  g.lineWidth = T * 0.04; g.strokeStyle = OUT;
  for (const yy of [15, 17]) for (let x = -0.2; x < COLS + 0.2; x += 0.42) {
    if (BRIDGES.some(b => Math.abs(x - b) < 1.3)) continue;
    const r = T * (0.17 + srnd() * 0.08);
    E(g, sx(x), sy(yy) + (yy === 15 ? -TH * 0.02 : TH * 0.02), r, r * 0.65, srnd() < 0.5 ? '#a9adb3' : '#c3c6cb');
  }
  // 桥
  for (const b of BRIDGES) drawBridge(g, b);
}
function drawBridge(g, b) {
  const x0 = sx(b - 1.2), x1 = sx(b + 1.2), y0 = sy(14.65), y1 = sy(17.35);
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x0 + T * 0.15, y0 + T * 0.15, x1 - x0, y1 - y0);
  const n = 8, ph = (y1 - y0) / n;
  g.lineWidth = T * 0.045; g.strokeStyle = OUT;
  for (let i = 0; i < n; i++) {
    g.fillStyle = i % 2 ? '#b57e45' : '#c48c51';
    g.fillRect(x0 + T * 0.18, y0 + i * ph, x1 - x0 - T * 0.36, ph);
    g.strokeRect(x0 + T * 0.18, y0 + i * ph, x1 - x0 - T * 0.36, ph);
    g.fillStyle = 'rgba(80,40,10,0.6)';
    dot(g, x0 + T * 0.4, y0 + i * ph + ph / 2, T * 0.04, 'rgba(80,40,10,0.7)');
    dot(g, x1 - T * 0.4, y0 + i * ph + ph / 2, T * 0.04, 'rgba(80,40,10,0.7)');
  }
  // 栏杆
  for (const rx of [x0, x1 - T * 0.24]) {
    g.lineWidth = T * 0.05;
    RR(g, rx, y0 - T * 0.1, T * 0.24, y1 - y0 + T * 0.2, T * 0.06, '#7c4a22');
    for (const py of [y0 - T * 0.15, y1 - T * 0.2]) RR(g, rx - T * 0.04, py, T * 0.32, T * 0.32, T * 0.05, '#8d5a2c');
  }
}

// =====================================================================
//  角色精灵（原创卡通造型；坐标单位=1格，原点在脚底）
// =====================================================================
function swing(atk, rest) {
  if (atk <= 0) return rest;
  const p = 1 - atk;
  if (p < 0.2) return rest - 1.3 * (p / 0.2);
  if (p < 0.45) return rest - 1.3 + 2.9 * ((p - 0.2) / 0.25);
  return rest + 1.6 - 1.6 * ((p - 0.45) / 0.55);
}

let AC = null, NB = null, muted = false;
const lastS = {};
function audioInit() {
  if (!AC) {

      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(type, f0, f1, dur, vol, delay = 0) {

}

  const ga = AC.createGain(); ga.gain.setValueAtTime(vol, t0); ga.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f).connect(ga).connect(AC.destination); s.start(t0); s.stop(t0 + dur + 0.05);
}

    case 'deploy': tone('sine', 200, 55, 0.2, 0.35); noise(0.12, 0.12, 900); break;
    case 'hit': noise(0.07, 0.12, 2200, 'bandpass'); break;

    if (/^[0-9]$/.test(e.key) && (NET.input || '').length < 4) { NET.input = (NET.input || '') + e.key; NET.roomErr = ''; }
    else if (e.key === 'Backspace') NET.input = (NET.input || '').slice(0, -1);
    else if (e.key === 'Enter') roomJoin();
    return;
  }
  if (!G || G.state !== 'play') return;
  const n = parseInt(e.key, 10); if (n >= 1 && n <= 4) { sel = sel === n - 1 ? null : n - 1; sfx('card'); }
});

// =====================================================================
//  主循环
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  DK.hintT = Math.max(0, DK.hintT - dt);
  try { if (G.online) netTick(dt); else Core.update(dt); render(now / 1000); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
let rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(layout, 120); });
loadDecks();
layout();
Core.hooks.sfx = sfx;
startLocal(menuDiff); G.state = 'menu';
{ const rq = new URLSearchParams(location.search).get('room'); if (rq && /^\d{4}$/.test(rq)) { openRoom('join'); NET.input = rq; if (G.state === 'room') roomJoin(); } }
requestAnimationFrame(frame);

// 调试/测试钩子
window.RA = { get G() { return G; }, get decks() { return decks; }, NET, DK, openDeck, deckTap, onButton, genDeck, deploy, startLocal, update: dt => Core.update(dt), tryDeployAt, adjustPlace, setSel: v => sel = v, layout: () => ({ OX, OY, T, TH, UI_TOP, UIL }) };
})();
